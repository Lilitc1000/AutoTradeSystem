[project]
name = "futures-trading"
version = "0.1.0"
description = "期货自动交易系统：多品种 · 多策略 · 回测实盘同构"
requires-python = ">=3.12"
# M0-b 起引入基础设施依赖（领域层仍保持纯标准库）
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.2",
  "pandas>=2.2",
  "pyarrow>=15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "akshare>=1.14",
]

[project.optional-dependencies]
# M2-b CTP 联调专用（Linux C++ 扩展，Windows 开发机不装）
ctp = ["openctp-ctp>=6.7"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
enable_error_code = "ignore-without-code"
# 注：SQLAlchemy 2.1 起 ext.mypy.plugin 已移除，Mapped[] 原生类型标注 mypy 直接支持

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# CTP spi 回调签名由 C++ 接口固定（OnRtnXxx(pXxx, pRspInfo, nRequestID, bIsLast)），
# 未使用的参数是协议的一部分，不是代码异味
"src/futures_trading/trading/infrastructure/ctp/adapters.py" = ["ARG002"]
"src/futures_trading/trading/infrastructure/ctp/worker.py" = ["ARG002"]
"tests/infrastructure/test_ctp_adapters.py" = ["ARG001", "ARG002", "SLF001"]
"tests/processes/test_trading_router.py" = ["ARG002"]  # Fake pubsub 对齐真 redis 签名

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "db: 需要真实 PostgreSQL 的持久化测试（未配置 ATS_TEST_DATABASE_URL/DATABASE_URL 时自动跳过）",
]
